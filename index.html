
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen & Home Decor Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fafafa;
            padding: 2rem 1rem;
        }
        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }
        header h1 {
            font-size: 2.2rem;
            color: #222;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        header p {
            color: #666;
            font-size: 1rem;
        }
        /* Responsive Grid Layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            aspect-ratio: 1 / 1; /* Square layout looks great for products */
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.4s ease;
        }
        /* Item Details Backdrop Overlay */
        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: #fff;
            padding: 1.5rem 1.25rem;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .caption h3 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        .caption p {
            font-size: 0.9rem;
            color: #ddd;
        }
        /* Interactive Hover Animations */
        .gallery-item:hover img {
            transform: scale(1.08);
            filter: brightness(0.85);
        }
        .gallery-item:hover .caption {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <h1>Kitchen & Home Decor</h1>
        <p>Curated essentials for beautiful living spaces</p>
    </header>

    <main class="gallery-grid">
        <!-- Item 1 -->
        <div class="gallery-item">
            <!-- Replace 'blender.jpg' with your actual image filename -->
            <img src="blender.jpg" alt="Premium Kitchen Blender">
            <div class="caption">
                <h3>Premium Blender</h3>
                <p>High-speed kitchen essential</p>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="gallery-item">
            <!-- Replace 'ceramic-vases.jpg' with your actual image filename -->
            <img src="ceramic-vases.jpg" alt="Minimalist Ceramic Vases">
            <div class="caption">
                <h3>Ceramic Vases</h3>
                <p>Matte-finish modern decor</p>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="gallery-item">
            <!-- Replace 'wooden-boards.jpg' with your actual image filename -->
            <img src="wooden-boards.jpg" alt="Handcrafted Wooden Serving Board">
            <div class="caption">
                <h3>Oak Serving Board</h3>
                <p>Handcrafted cutting & serving block</p>
            </div>
        </div>

        <!-- Item 4 -->
        <div class="gallery-item">
            <!-- Replace 'coffee-mugs.jpg' with your actual image filename -->
            <img src="coffee-mugs.jpg" alt="Artisan Coffee Mugs">
            <div class="caption">
                <h3>Artisan Mugs</h3>
                <p>Stoneware set of 4</p>
            </div>
        </div>
    </main>

</body>
</html>
